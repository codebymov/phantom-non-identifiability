[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kibapap"
version = "0.1.0"
description = "Physics-informed neural network prototype for hot-air web drying"
authors = [{name = "Ali Hariri Movahed", email = "ali.hariri.movahed@rwth-aachen.de"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.6",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
demo = ["streamlit>=1.30", "pillow>=10.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
